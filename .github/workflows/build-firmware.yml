name: Build firmware

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      board:
        description: Board profile
        required: true
        default: ALL
        type: choice
        options:
          - R3G
          - HIWIFI4
          - E8820S
          - A040WQ
          - MSG1500
          - R6800
          - R3P
          - RM2100
          - SIM-AX18T
          - ALL

permissions:
  contents: read

concurrency:
  group: rtax53u-firmware-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 720
    env:
      SELECTED_BOARD: ${{ inputs.board || 'ALL' }}
      BUILD_ROOT: /build

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Mount short build path
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p "$BUILD_ROOT"
          sudo mount --bind "$GITHUB_WORKSPACE" "$BUILD_ROOT"
          sudo chown "$(id -u):$(id -g)" "$BUILD_ROOT"
          cd "$BUILD_ROOT"
          printf 'Build path: %s\n' "$PWD"

      - name: Configure build Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint autogen antlr3 binutils binutils-dev \
            bison build-essential bzip2 cmake device-tree-compiler dos2unix flex gawk \
            gengetopt gettext git gperf intltool lib32gcc-s1 lib32stdc++6 lib32z1 \
            libc6-dev-i386 libelf-dev libelf1:i386 libglib2.0-dev libltdl-dev \
            liblzma-dev liblzo2-dev libncurses5:i386 libncurses5-dev libssl-dev \
            libtool libtool-bin msmtp p7zip-full patch qemu-utils sharutils shtool \
            subversion texinfo uglifyjs unzip upx-ucl uuid-dev wget xmlto xsltproc \
            zlib1g-dev

      - name: Install MIPS toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/SWRT-dev/mtk-toolchains.git "$RUNNER_TEMP/mtk-toolchains"
          test -x "$RUNNER_TEMP/mtk-toolchains/toolchain-mipsel_24kc_gcc-5.4.0_musl-1.1.24/bin/mipsel-openwrt-linux-gcc"
          sudo ln -sfn "$RUNNER_TEMP/mtk-toolchains/toolchain-mipsel_24kc_gcc-5.4.0_musl-1.1.24" /opt/toolchain-mipsel_24kc_gcc-5.4.0_musl-1.1.24
          /opt/toolchain-mipsel_24kc_gcc-5.4.0_musl-1.1.24/bin/mipsel-openwrt-linux-gcc --version
          df -h /

      - name: Build selected profile
        if: env.SELECTED_BOARD != 'ALL'
        working-directory: ${{ env.BUILD_ROOT }}/release/src-ra-openwrt-4210
        shell: bash
        run: make BOARD_PROFILE="$SELECTED_BOARD" rt-ax53u

      - name: Build all profiles serially
        if: env.SELECTED_BOARD == 'ALL'
        working-directory: ${{ env.BUILD_ROOT }}/release/src-ra-openwrt-4210
        shell: bash
        run: |
          set -euo pipefail
          for board in R3G HIWIFI4 E8820S A040WQ MSG1500 R6800 R3P RM2100 SIM-AX18T; do
            make BOARD_PROFILE="$board" rt-ax53u
          done

      - name: Validate board profiles
        shell: bash
        working-directory: ${{ env.BUILD_ROOT }}
        run: python3 tools/check_board_profiles.py

      - name: Collect firmware
        shell: bash
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find release/src-ra-openwrt-4210/image -maxdepth 1 -type f \
            \( -name "*.trx" -o -name "*.md5" \) \
            -exec cp -a {} artifacts/ \;
          test -n "$(find artifacts -maxdepth 1 -type f -name "*.trx" -print -quit)"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.SELECTED_BOARD }}-${{ github.run_number }}
          path: /build/artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Unmount short build path
        if: always()
        shell: bash
        run: |
          if mountpoint -q "$BUILD_ROOT"; then
            sudo umount "$BUILD_ROOT"
          fi
